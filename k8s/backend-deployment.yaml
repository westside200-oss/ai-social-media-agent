# Kubernetes deployment configuration (optional for scaling)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-social-media-backend
  labels:
    app: ai-social-media
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-social-media-backend
  template:
    metadata:
      labels:
        app: ai-social-media-backend
    spec:
      containers:
      - name: backend
        image: your_registry/ai-social-media-backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: database-url
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: anthropic-api-key
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ai-social-media-backend
spec:
  selector:
    app: ai-social-media-backend
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
  type: LoadBalancer
